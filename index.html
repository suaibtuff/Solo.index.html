<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guitar Solo Generator</title>
<style>
:root{--bg:#0b0b0e;--fg:#e8e8ee;--mut:#8a8a96;--ac:#ff6a3d;--card:#15151b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px}
button,label.f{background:var(--card);color:var(--fg);border:1px solid #2a2a33;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
button.on,button.go{background:var(--ac);border-color:var(--ac);color:#111;font-weight:600}
button:disabled{opacity:.4}label.f{position:relative;overflow:hidden;display:inline-block}input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
#name{color:var(--mut);max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{flex:1;min-height:0}canvas{display:block;width:100%;height:100%}
footer{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center}input[type=range]{flex:1;accent-color:var(--ac)}
#bar{height:3px;background:#222;border-radius:2px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#msg{color:var(--mut);font-size:12px;min-height:16px}
</style></head><body>
<header>
 <label class="f">Upload song<input id="file" type="file"></label>
 <span id="name">No file</span>
 <span id="tones"><button data-t="clean" class="on">Clean</button> <button data-t="overdrive">Overdrive</button> <button data-t="distortion">Distortion</button></span>
 <button id="demo">Try demo</button>
 <button id="rec">Record mic</button>
 <input id="txt" placeholder="Type notes: E4 E4 F4 G4" style="background:#15151b;color:#e8e8ee;border:1px solid #2a2a33;border-radius:8px;padding:8px;width:200px"><button id="typed">Play notes</button>
 <button id="analyze" class="go" disabled>Analyze</button>
</header>
<div id="view"></div>
<footer>
 <div id="bar"><i></i></div><div id="msg"></div>
 <div class="row">
  <button id="play" disabled>Play</button><button id="replay" disabled>Replay</button>
  <label style="color:#8a8a96;white-space:nowrap"><input type="checkbox" id="orig"> original</label><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" disabled><span id="tot">0:00</span>
 </div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id), fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
/* ---------- 3D scene ---------- */
const S=14, X=n=>S*(1-Math.pow(2,-n/12)), ZS=i=>(i-2.5)*.34;
const view=$('view'), R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(devicePixelRatio); view.appendChild(R.domElement);
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(40,1,.1,100);
cam.position.set(7,8,10); cam.lookAt(7,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x223,.8)); const dl=new THREE.DirectionalLight(0xffffff,1); dl.position.set(5,10,8); scene.add(dl);
const mat=(c,m=.3,r=.5)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});
function box(w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
function cyl(r,h,m,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),m);o.position.set(x,y,z);scene.add(o);return o}
box(S*.72+1,.3,2.3,(S*.72)/2-.15,-.05,0,mat(0x3a2415));            // neck/fretboard
box(2.2,.35,2.5,-1.5,-.05,0,mat(0x2a1a10));                          // headstock
for(let i=0;i<6;i++)cyl(.12,.5,mat(0xcccccc,.9,.3),-1.9+(i%3)*.7,.3,(i<3?-1:1)*1.0);  // tuners
for(let n=0;n<=22;n++)box(.05,.08,2.3,X(n),.14,0,mat(0xd8d8d8,.9,.3)); // frets
[3,5,7,9,12,15,17,19,21].forEach(n=>cyl(.07,.02,mat(0xfff3d0),(X(n-1)+X(n))/2,.11,0));
const body=cyl(2.6,.8,mat(0xa3201a,.4,.35),11.8,-.25,0); body.scale.set(1.45,1,1.1);
const body2=cyl(1.8,.8,mat(0xa3201a,.4,.35),9.6,-.25,1.4);
box(.5,.15,2,11.2,.25,0,mat(0x111111)); box(.5,.15,2,12.6,.25,0,mat(0x111111)); box(.3,.2,2.4,S,.2,0,mat(0xbbbbbb,.9,.3));
for(let i=0;i<6;i++)cyl(.012+(5-i)*.004,S,mat(0xe0e0e0,.9,.2),S/2,.25,ZS(i)).rotation.z=Math.PI/2;
const skin=mat(0xd9a27e,0,.8);
const lf=[1,2,3,4].map(()=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.11,.09,1,10),skin);scene.add(m);return m});
const lpalm=box(.9,.5,1.4,0,2.6,-1.6,skin);
const pick=new THREE.Mesh(new THREE.CylinderGeometry(.1,.06,1,10),skin), rpalm=box(1.2,.5,1.2,13,2,0,skin);
scene.add(pick);
function resize(){const w=view.clientWidth,h=view.clientHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
/* ---------- audio ---------- */
const AC=new (window.AudioContext||window.webkitAudioContext)(), SRATE=44100;
let notes=[],dur=0,raw=null,buf=null,src=null,playing=false,offset=0,startAt=0,tone='clean';
const TONES={clean:{g:1,lp:7000},overdrive:{g:4,lp:5000},distortion:{g:16,lp:3800}};
function karplus(){ // physical-model plucked string, one per note
  const out=new Float32Array(Math.ceil(dur*SRATE)+SRATE*2);
  for(const n of notes){
    const N=Math.round(SRATE/(440*2**((n.pitch-69)/12))), d=new Float32Array(N).map(()=>Math.random()*2-1);
    const len=Math.floor((n.dur+.25)*SRATE), i0=Math.floor(n.t*SRATE), hold=n.dur*SRATE; let k=0;
    for(let i=0;i<len&&i0+i<out.length;i++){
      const v=(d[k]+d[(k+1)%N])*.4985; d[k]=v; k=(k+1)%N;
      out[i0+i]+=v*(i<hold?1:Math.exp(-(i-hold)/(.04*SRATE)));
    }
  }
  let pk=0;for(const v of out)pk=Math.max(pk,Math.abs(v)); for(let i=0;i<out.length;i++)out[i]*=.8/pk;
  return out;
}
async function renderTone(){
  const t=TONES[tone], oc=new OfflineAudioContext(1,raw.length,SRATE), b=oc.createBuffer(1,raw.length,SRATE);
  b.copyToChannel(raw,0);
  const s=oc.createBufferSource();s.buffer=b;
  const ws=oc.createWaveShaper(),c=new Float32Array(2048);
  for(let i=0;i<2048;i++)c[i]=Math.tanh(t.g*(i/1023.5-1))/Math.tanh(t.g);
  ws.curve=c;ws.oversample='4x';
  const lp=oc.createBiquadFilter();lp.type='lowpass';lp.frequency.value=t.lp;
  s.connect(ws);ws.connect(lp);lp.connect(oc.destination);s.start();
  buf=await oc.startRendering();
}
const pos=()=>playing?Math.min(AC.currentTime-startAt,dur):offset;
function stop(){if(osrc){try{osrc.stop()}catch(e){}osrc=null}if(src){src.onended=null;try{src.stop()}catch(e){}src=null}}
function play(from){stop();offset=from;src=AC.createBufferSource();src.buffer=buf;src.connect(AC.destination);
  AC.resume();if(orig&&$('orig').checked){osrc=AC.createBufferSource();osrc.buffer=orig;const g=AC.createGain();g.gain.value=.7;osrc.connect(g);g.connect(AC.destination);osrc.start(0,from)}src.start(0,from);startAt=AC.currentTime-from;playing=true;$('play').textContent='Pause'}
function pause(){offset=pos();stop();playing=false;$('play').textContent='Play'}
$('play').onclick=()=>playing?pause():play(offset>=dur?0:offset);
$('replay').onclick=()=>play(0);
$('seek').oninput=e=>{const t=e.target.value/1000*dur;playing?play(t):offset=t};
document.querySelectorAll('#tones button').forEach(b=>b.onclick=async()=>{
  document.querySelectorAll('#tones button').forEach(x=>x.classList.toggle('on',x===b));tone=b.dataset.t;
  if(raw){const was=playing,p=pos();pause();$('msg').textContent='Rendering tone…';await renderTone();$('msg').textContent='';was?play(p):offset=p}});
/* ---------- animation driven by the note list ---------- */
const L=(a,b,k)=>a+(b-a)*k; let cur=null,hx=X(1),px=13,pz=0;
function frame(){
  requestAnimationFrame(frame);
  const t=pos(); let idx=-1;
  if(notes.length){let lo=0,hi=notes.length-1;while(lo<=hi){const m=(lo+hi)>>1;notes[m].t<=t?(idx=m,lo=m+1):hi=m-1}}
  const n=idx>=0?notes[idx]:null, active=n&&t<n.t+n.dur+.04;
  if(n){hx=L(hx,X(n.hand-.5)+.2,.35); pz=L(pz,ZS(n.string),.5)}
  lf.forEach((f,k)=>{ // finger k+1
    const press=active&&n.finger===k+1&&n.fret>0;
    const fx=X(((n&&n.hand)||1)+k-.5)+.15, fz=press?ZS(n.string):ZS(2.5)+(k-1.5)*.1-(.2);
    f.userData.x=L(f.userData.x??fx,fx,.4);f.userData.z=L(f.userData.z??fz,fz,.5);f.userData.y=L(f.userData.y??1,press?.3:1,.5);
    const top=2.5,bot=f.userData.y; f.position.set(f.userData.x,(top+bot)/2,f.userData.z); f.scale.y=top-bot;
  });
  lpalm.position.x=hx+.3;
  let ph=1,dir=1; if(n){ph=Math.min((t-n.t)/.12,1);dir=idx%2?-1:1}
  const py=n?.9-.65*Math.sin(Math.PI*ph):1.2; px=L(px,12.6,.2);
  pick.position.set(px+dir*(n?.2*Math.sin(Math.PI*ph):0),py+.5,pz); pick.scale.y=1;
  rpalm.position.set(13.4,py+1.6,pz+.3);
  R.render(scene,cam);
  if(dur){$('cur').textContent=fmt(t);$('seek').value=t/dur*1000;if(playing&&t>=dur)pause()}
}
frame();
/* ---------- in-browser analysis (YIN pitch tracker) ---------- */
const OPEN=[40,45,50,55,59,64];
function arrange(ns){let pos=1,prev=null;return ns.map(n=>{let m=n.midi;while(m<40)m+=12;while(m>81)m-=12;let best=null;
 OPEN.forEach((o,s)=>{const f=m-o;if(f>=0&&f<=17){const c=(f?Math.abs(f-pos):.5)+(prev!==null?Math.abs(s-prev)*.15:0);if(!best||c<best[0])best=[c,s,f]}});
 const [,s,f]=best;if(f&&!(f>=pos&&f<=pos+3))pos=Math.max(1,f-1);prev=s;
 return {t:n.t,dur:n.dur,pitch:OPEN[s]+f,string:s,fret:f,finger:f?Math.min(Math.max(f-pos+1,1),4):0,hand:pos}})}
async function loadNotes(ns,d){pause();notes=ns;dur=d;raw=karplus();$('msg').textContent='Rendering tone…';await renderTone();
 $('msg').textContent=notes.length+' notes';$('tot').textContent=fmt(dur);offset=0;$('bar').firstChild.style.width='100%';
 ['play','replay','seek'].forEach(i=>$(i).disabled=false)}
let orig=null,osrc=null;$('orig').onchange=()=>{if(playing)play(pos())};
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
 for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a);for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const u=i+k,v=u+len/2,tr=re[v]*cr-im[v]*ci,ti=re[v]*ci+im[v]*cr;re[v]=re[u]-tr;im[v]=im[u]-ti;re[u]+=tr;im[u]+=ti;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}}
async function analyzeBuffer(ab){orig=ab;
 const fac=Math.max(1,Math.round(ab.sampleRate/22050)),sr=ab.sampleRate/fac,ch=ab.getChannelData(0);
 const N=Math.min(Math.floor(ch.length/fac),Math.floor(120*sr)),x=new Float32Array(N);
 for(let i=0;i<N;i++){let s=0;for(let k=0;k<fac;k++)s+=ch[i*fac+k];x[i]=s/fac}
 const W=4096,HOP=1024,re=new Float64Array(W),im=new Float64Array(W),mag=new Float64Array(W/2),hann=new Float64Array(W).map((_,i)=>.5-.5*Math.cos(2*Math.PI*i/W));
 const kLo=Math.floor(130*W/sr),kHi=Math.floor(1000*W/sr),mid=[];
 for(let p=0;p+W<N;p+=HOP){
  let e=0;for(let j=0;j<W;j++){const v=x[p+j];e+=v*v;re[j]=v*hann[j];im[j]=0}
  let m=-1;
  if(Math.sqrt(e/W)>.004){fft(re,im);for(let k=0;k<W/2;k++)mag[k]=Math.log(1+10*Math.hypot(re[k],im[k]));
   let bs=-1,bk=kLo;for(let k=kLo;k<=kHi;k++){const sc=mag[k]+mag[2*k]+mag[3*k]+mag[4*k];if(sc>bs){bs=sc;bk=k}}
   const a=mag[bk-1],b=mag[bk],c=mag[bk+1],off=(a-c)/(2*(a-2*b+c)||1);
   m=Math.round(69+12*Math.log2((bk+off)*sr/W/440))}
  mid.push(m);
  if(mid.length%40==0){$('bar').firstChild.style.width=(p/N*100)+'%';await new Promise(r=>setTimeout(r))}}
 const med=mid.map((_,i)=>{const w=mid.slice(Math.max(0,i-2),i+3).sort((a,b)=>a-b);return w[w.length>>1]});
 const dt=HOP/sr,ns=[];
 for(let i=0;i<med.length;){let j=i;while(j<med.length&&med[j]===med[i])j++;if(med[i]>=0&&j-i>=2)ns.push({t:i*dt,dur:(j-i)*dt,midi:med[i]});i=j}
 for(let i=0;i<ns.length-1;i++){const g=ns[i+1].t-(ns[i].t+ns[i].dur);if(g<.12)ns[i].dur+=g}
 if(!ns.length)throw new Error('No clear melody found');
 return [arrange(ns),N/sr]}
async function analyzeOld(ab){
 const fac=Math.max(1,Math.round(ab.sampleRate/22050)),sr=ab.sampleRate/fac,ch=ab.getChannelData(0);
 const N=Math.min(Math.floor(ch.length/fac),Math.floor(120*sr)),x=new Float32Array(N);
 for(let i=0;i<N;i++){let s=0;for(let k=0;k<fac;k++)s+=ch[i*fac+k];x[i]=s/fac}
 const W=1024,HOP=640,t0=Math.floor(sr/1319),t1=Math.floor(sr/82),mid=[],d=new Float32Array(t1+2);
 for(let p=0;p+W+t1<N;p+=HOP){
  let e=0;for(let j=0;j<W;j++)e+=x[p+j]*x[p+j];let m=-1;
  if(Math.sqrt(e/W)>.01){let run=0;d[0]=1;
   for(let tau=1;tau<=t1;tau++){let s=0;for(let j=0;j<W;j++){const v=x[p+j]-x[p+j+tau];s+=v*v}run+=s;d[tau]=s*tau/run}
   for(let tau=Math.max(2,t0);tau<t1;tau++)if(d[tau]<.15){while(tau+1<t1&&d[tau+1]<d[tau])tau++;m=Math.round(69+12*Math.log2(sr/tau/440));break}}
  mid.push(m);
  if(mid.length%60==0){$('bar').firstChild.style.width=(p/N*100)+'%';await new Promise(r=>setTimeout(r))}}
 const med=mid.map((_,i)=>{const w=mid.slice(Math.max(0,i-2),i+3).sort((a,b)=>a-b);return w[w.length>>1]});
 const dt=HOP/sr,ns=[];
 for(let i=0;i<med.length;){let j=i;while(j<med.length&&med[j]===med[i])j++;if(med[i]>=0&&j-i>=3)ns.push({t:i*dt,dur:(j-i)*dt,midi:med[i]});i=j}
 if(!ns.length)throw new Error('No clear melody found');
 return [arrange(ns),N/sr]}
let file=null;
$('file').onchange=e=>{file=e.target.files[0];if(file){$('name').textContent=file.name;$('analyze').disabled=false}};
$('demo').onclick=()=>{const m=[64,64,65,67,67,65,64,62,60,60,62,64,64,62,62];let t=.3;
 const ns=m.map((p,i)=>{const d=i==12?.6:i==13?.2:i==14?.8:.4;const n={t,dur:d*.9,midi:p};t+=d;return n});
 $('name').textContent='Demo: Ode to Joy';loadNotes(arrange(ns),t+.5)};
$('typed').onclick=()=>{const M={C:0,D:2,E:4,F:5,G:7,A:9,B:11};let t=.3;const ns=[];
 for(const k of $('txt').value.trim().split(/\s+/)){const m=/^([A-Ga-g])([#b]?)(\d)$/.exec(k);if(!m){t+=.45;continue}
  const p=(+m[3]+1)*12+M[m[1].toUpperCase()]+(m[2]=='#'?1:m[2]=='b'?-1:0);ns.push({t,dur:.4,midi:p});t+=.45}
 if(!ns.length){$('msg').textContent='Type notes like: E4 E4 F4 G4 G4 F4 E4 D4';return}
 $('name').textContent='Typed melody';loadNotes(arrange(ns),t+.5)};
async function recStart(){
 try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const mr=new MediaRecorder(st),ch=[];mr.ondataavailable=e=>ch.push(e.data);
  mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());$('rec').textContent='Record mic';$('msg').textContent='Analyzing…';
   try{const ab=await AC.decodeAudioData(await new Blob(ch,{type:mr.mimeType}).arrayBuffer());const [ns,d]=await analyzeBuffer(ab);$('name').textContent='Mic recording';await loadNotes(ns,d)}catch(e){$('msg').textContent='Error: '+e.message}};
  mr.start();let s=20;$('rec').textContent='Stop ('+s+')';$('msg').textContent='Recording… play the song near the mic, or sing/hum/whistle the melody';
  const iv=setInterval(()=>{s--;$('rec').textContent='Stop ('+s+')';if(s<=0)$('rec').click()},1000);
  $('rec').onclick=()=>{clearInterval(iv);if(mr.state!='inactive')mr.stop();$('rec').onclick=recStart};
 }catch(e){$('msg').textContent='Microphone unavailable: '+e.message+' — try opening the link in Chrome/Safari'}}
$('rec').onclick=recStart;
$('analyze').onclick=async()=>{pause();$('analyze').disabled=true;$('msg').textContent='Decoding…';
 try{const ab=await AC.decodeAudioData(await file.arrayBuffer());$('msg').textContent='Analyzing melody…';
  const [ns,d]=await analyzeBuffer(ab);await loadNotes(ns,d)}catch(e){$('msg').textContent='Error: '+e.message}
 $('analyze').disabled=false};
</script></body></html>
